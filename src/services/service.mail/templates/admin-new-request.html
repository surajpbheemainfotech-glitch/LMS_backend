<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>New LMS Join Request</title>
</head>

<body style="font-family: Arial, sans-serif; background:#f4f6f8; padding:20px;">

<table width="100%" align="center" cellspacing="0" cellpadding="0">
<tr>
<td align="center">

<table width="550" style="background:#ffffff;padding:30px;border-radius:8px;" cellspacing="0" cellpadding="0">

<tr>
<td align="center">
<h2 style="margin-bottom:20px;">New LMS Join Request</h2>
</td>
</tr>

<tr>
<td>

<p>A new user has requested to join the LMS platform.</p>

<table width="100%" cellpadding="10" style="border-collapse:collapse;font-size:14px;">

<tr>
<td style="border:1px solid #ddd;"><b>Name</b></td>
<td style="border:1px solid #ddd;color:#eb7126;">{{name}}</td>
</tr>

<tr>
<td style="border:1px solid #ddd;"><b>Email</b></td>
<td style="border:1px solid #ddd;color:#eb7126;">{{email}}</td>
</tr>

<tr>
<td style="border:1px solid #ddd;"><b>Role</b></td>
<td style="border:1px solid #ddd;color:#eb7126;">{{role}}</td>
</tr>

<tr>
<td style="border:1px solid #ddd;"><b>Phone</b></td>
<td style="border:1px solid #ddd;color:#eb7126;">{{phone}}</td>
</tr>

<tr>
<td style="border:1px solid #ddd;"><b>Message</b></td>
<td style="border:1px solid #ddd;color:#eb7126;">{{message}}</td>
</tr>

</table>

<p style="margin-top:20px;">
Please review and approve this request from the admin dashboard.
</p>

<table width="100%" style="margin-top:20px;">
<tr>
<td align="center">

<a href="{{admin_url}}"
style="
background:#ec8241;
color:#ffffff;
text-decoration:none;
padding:12px 25px;
border-radius:6px;
display:inline-block;
font-weight:bold;
">
See All Requests
</a>

</td>
</tr>
</table>

</td>
</tr>

</table>

</td>
</tr>
</table>

</body>
</html>
